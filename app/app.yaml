command: ["uv", "run", "start-app"]
# databricks apps listen by default on port 8000

env:
  # Trace to a shared MLflow experiment (Task 5). No experiment resource required.
  - name: MLFLOW_TRACKING_URI
    value: "databricks"
  - name: MLFLOW_EXPERIMENT_NAME
    value: "/Shared/marc-dispatch-agent"
  - name: API_PROXY
    value: "http://localhost:8000/invocations"
  - name: CHAT_APP_PORT
    value: "3000"
  - name: CHAT_PROXY_TIMEOUT_SECONDS
    value: "300"
  # Sample-data mode: the agent runs on built-in Sunny Bay data, so the app deploys with
  # no resources or config to wire up. Wiring the real Genie spaces + governed write-back
  # is Lab 4 (AI Gateway and Write-back).
  - name: AGENT_DRY_RUN
    value: "1"
