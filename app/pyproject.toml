[project]
name = "marc-manager-agent"
version = "0.1.0"
description = "Marc's Manager Agent — a custom control-flow agent, Lab 3 of Agents in a Day"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "databricks-sdk>=0.30",
    "mlflow>=3.10.0",
    "databricks-langchain>=0.17.0",
    "databricks-agents>=1.9.3",
    "langgraph>=1.1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
]
