bundle:
  name: marc_dispatch_agent

# Only sync the app source — never the local venv or generated artifacts.
sync:
  exclude:
    - .venv/**
    - "**/__pycache__/**"
    - .pytest_cache/**
    - mlruns/**
    - mlflow.db
    - .env

resources:
  apps:
    marc_dispatch_agent:
      name: "marc-dispatch-agent"
      description: "Marc's dispatch agent (Agents in a Day, Lab 3)"
      # Points at the folder holding app.yaml (this bundle root). app.yaml drives the
      # command + env, so there is no `config` block here to drift out of sync.
      source_code_path: ./
      # NOTE: this `resources:` block is applied ONLY by `databricks bundle deploy` (used once by
      # the workshop to create the app). Lab 3 participants redeploy from the app UI, which does
      # NOT process this block — so editing it here to wire Lakebase does nothing on their path.
      # In Lab 3 each participant attaches their OWN autoscaling Lakebase project via the app UI
      # (Edit → App resources), per the add-lakebase-short-term-memory skill. Left here only as the
      # bundle-time default for initial app creation.
      resources:
        - name: 'lakebase'
          database:
            instance_name: "sunny-bay-roastery-lakebase"
            database_name: "databricks_postgres"
            permission: 'CAN_CONNECT_AND_CREATE'

targets:
  dev:
    mode: development
    default: true

  prod:
    mode: production
    resources:
      apps:
        marc_dispatch_agent:
          name: marc-dispatch-agent
