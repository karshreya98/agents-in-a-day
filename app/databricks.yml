bundle:
  name: marc_dispatch_agent

# Only sync the app source — never the local venv or generated artifacts.
sync:
  exclude:
    - .venv/**
    - "**/__pycache__/**"
    - .pytest_cache/**
    - mlruns/**
    - mlflow.db
    - .env

resources:
  apps:
    marc_dispatch_agent:
      name: "marc-dispatch-agent"
      description: "Marc's dispatch agent (Agents in a Day, Lab 3)"
      # Points at the folder holding app.yaml (this bundle root). app.yaml drives the
      # command + env, so there is no `config` block here to drift out of sync.
      source_code_path: ./
      # Lakebase is intentionally NOT wired here. In Lab 3 each participant attaches their OWN
      # autoscaling Lakebase project to the app via the UI (Edit → App resources), per the
      # add-lakebase-short-term-memory skill. We declare no Lakebase resource so the bundle never
      # points at a shared or nonexistent instance. (A `resources:` block here would apply only via
      # `databricks bundle deploy` anyway — not the UI Deploy participants use.)

targets:
  dev:
    mode: development
    default: true

  prod:
    mode: production
    resources:
      apps:
        marc_dispatch_agent:
          name: marc-dispatch-agent
