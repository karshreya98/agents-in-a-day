command:
  - "python"
  - "-m"
  - "uvicorn"
  - "app:app"
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "8000"

# ── Environment variables ────────────────────────────────────────────────────
# All values shown here are defaults / placeholders. Update them in the
# Databricks Apps UI (Configure → Environment) after running Lab 2 and Lab 3.
#
# The App service principal identity (DATABRICKS_HOST, token) is injected by
# the Apps runtime automatically — never hardcode a token here.
env:
  # Lab 2: Agent Bricks Supervisor endpoint (set after you create the Supervisor).
  - name: SUPERVISOR_ENDPOINT
    value: "marc-maintenance-supervisor-endpoint"

  # Lab 3: Lakebase (Postgres) connection for conversation memory.
  # Hostname looks like: ep-xxx-yyy.database.us-east-1.cloud.databricks.com
  - name: PGHOST
    value: ""
  - name: PGDATABASE
    value: "databricks_postgres"
  - name: PGPORT
    value: "5432"
  # PGUSER: leave blank — the App resolves to the service principal ID at startup.
  - name: PGUSER
    value: ""

  # Unity Catalog coordinates for Lab 4 write-back verification.
  - name: DATABRICKS_CATALOG
    value: "sunny_bay_roastery"
  - name: DATABRICKS_SCHEMA
    value: "coffee_maintenance"
  - name: DATABRICKS_WAREHOUSE_ID
    value: ""

# ── Resource bindings ────────────────────────────────────────────────────────
# Declaring the serving endpoint here grants the App SP CAN_QUERY permission
# automatically — no manual permission grant needed, and NO approval prompts
# at runtime (all MCP tool calls happen server-side inside the Supervisor).
resources:
  - name: "supervisor-endpoint"
    description: "Marc Maintenance Supervisor — Agent Bricks MAS"
    serving_endpoint:
      name: "marc-maintenance-supervisor-endpoint"
      permission: "CAN_QUERY"
