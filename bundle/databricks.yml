bundle:
  name: agents_in_a_day
  uuid: a1d3f2c4-8e5b-4a7d-9f6c-2b0e1d4c3a8f

include:
  - resources/*.yml

# ─────────────────────────────────────────────────────────────
# Set 'catalog' to your Unity Catalog catalog name before Deploy.
# Use the same catalog you installed Dashboard in a Day (DAID) into.
#   - Free Edition: create a new catalog (e.g. sunny_bay_roastery)
#   - Shared workspace: use an existing catalog you own
# 'prefix' is optional — set it (e.g. "sbr_") when many people share one
# catalog, so table names don't collide.
# ─────────────────────────────────────────────────────────────
variables:
  catalog:
    description: The catalog to use (must match your DAID catalog)
    default: sunny_bay_roastery

  prefix:
    description: Optional prefix for table names when sharing a catalog
    default: ""

targets:
  dev:
    mode: development
    default: true
    # Override the catalog/prefix on the CLI or edit here before deploy, e.g.:
    #   databricks bundle deploy -t dev --var catalog=my_catalog --var prefix=sbr_
