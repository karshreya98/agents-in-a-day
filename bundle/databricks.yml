bundle:
  name: agents_in_a_day
  uuid: a1d3f2c4-8e5b-4a7d-9f6c-2b0e1d4c3a8f

include:
  - resources/*.yml

# ─────────────────────────────────────────────────────────────
# Set 'catalog' to your Unity Catalog catalog name before Deploy.
# Free Edition: create a new catalog (e.g. sunny_bay_roastery)
# Shared / FEVM: use an existing catalog you own
# ─────────────────────────────────────────────────────────────
variables:
  catalog:
    description: The catalog to use
    default: sunny_bay_roastery

  prefix:
    description: Optional prefix for table names when sharing a catalog
    default: ""

targets:
  dev:
    mode: development
    default: true
    variables:
      catalog: serverless_stable_4jxp5j_catalog
      prefix: "sbr_"
