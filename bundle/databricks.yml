bundle:
  name: agents_in_a_day
  uuid: a1d3f2c4-8e5b-4a7d-9f6c-2b0e1d4c3a8f

include:
  - resources/*.yml

# Configure these variables before you click Deploy.
variables:
  catalog:
    description: The catalog to use (Free Edition default: sunny_bay_roastery)
    default: sunny_bay_roastery

  prefix:
    description: Optional prefix for table names when sharing a catalog with others
    default: ""

targets:
  dev:
    mode: development
    default: true
    variables:
      catalog: sunny_bay_roastery
      prefix: ""
