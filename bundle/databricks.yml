bundle:
  name: agents_in_a_day
  uuid: a1d3f2c4-8e5b-4a7d-9f6c-2b0e1d4c3a8f

include:
  - resources/*.yml

# ─────────────────────────────────────────────────────────────
# Set 'catalog' to the Unity Catalog catalog you want to use before Deploy.
#   - Free Edition: create a new catalog (e.g. sunny_bay_roastery)
#   - Shared workspace: use an existing catalog you own, or give each
#     person their own catalog so table names don't collide.
# Not sure which catalog you can write to? Open the setup notebook
# (src/notebooks/Lab 0 - Setup.py) and run its first cell.
# ─────────────────────────────────────────────────────────────
variables:
  catalog:
    description: The Unity Catalog catalog to create the workshop assets in
    default: sunny_bay_roastery

  # Warehouse used by the sales metric view, the pre-built Sales Genie, and the
  # sales dashboard. Resolved by name at deploy time — this warehouse must exist
  # in the target workspace. Free Edition provides "Serverless Starter Warehouse"
  # by default; on a shared workspace change the name to one you can use.
  warehouse_id:
    description: SQL warehouse for the sales Genie and dashboard
    lookup:
      warehouse: "Serverless Starter Warehouse"

targets:
  dev:
    mode: development
    default: true
    # Override the catalog on the CLI or edit above before deploy, e.g.:
    #   databricks bundle deploy -t dev --var catalog=my_catalog
